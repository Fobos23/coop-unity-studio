# Settings of pre-commit.sh for this project (sourced by bash; paths relative to the repository root).
# The file with the network version string: a line like  public const string Version = "0.1.0";
NETVERSION_FILE="Assets/__GAME__/Scripts/Net/NetVersion.cs"
# Transport limits that must never grow: "<file>:<const name>" pairs (const written as  Name = <number>).
LIMITS="Assets/__GAME__/Scripts/Net/TransportLimits.cs:MaxMessage Assets/__GAME__/Scripts/Net/TransportLimits.cs:NgoMtu"
# Network prefab list assets (a change of the list is a format change).
NET_PREFAB_LISTS=':(glob)Assets/**/*NetworkPrefabs*.asset'
# Editor junk that re-saves itself and must not be committed.
JUNK=("Assets/TextMesh Pro/Resources/Fonts & Materials/LiberationSans SDF - Fallback.asset"
      Assets/Resources/PerformanceTestRunInfo.json Assets/Resources/PerformanceTestRunInfo.json.meta
      ProjectSettings/PackageManagerSettings.asset)
